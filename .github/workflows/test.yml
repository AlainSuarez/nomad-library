name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: tools/fetch_data.sh
      - name: Chicago catalog for the large-catalog tests
        run: mkdir -p fixtures && curl -fsSL -o fixtures/chipublib.json.gz https://nomad-library-copies.pages.dev/snap/chipublib.json.gz
      - run: node --test test/resolver.mjs
      - run: node test/browser.mjs
        env: { FIXTURE_DIR: fixtures, CHROME_PATH: /usr/bin/google-chrome }
